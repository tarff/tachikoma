# The type check, the build and the tests on a clean Windows machine, for each pull request and each push to main. A
# trial (user, 2026-11-07): Windows only, as the tests have passed only there; Linux, macOS and the fresh-install check
# come with release 14. Packages install through Socket Firewall (sfw), as every registry install does here.
name: CI

on:
  pull_request:
  push:
    branches: [main, ci-trial] # ci-trial: the trial's own branch, taken out once it is decided

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The suite takes about 6 minutes on the user's PC; this stops a hung run well short of GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # the major version the tests pass on locally
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      - run: npm run typecheck
      - run: npm run build
      # external.test.ts is left out, as on the user's PC.
      - run: node node_modules/vitest/vitest.mjs run --exclude tests/tui/external.test.ts
